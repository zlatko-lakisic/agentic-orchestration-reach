[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-tool"
version = "0.1.0"
description = "Minimal echo MCP shim for Reach custom-tool contract tests"
requires-python = ">=3.11"

[project.scripts]
echo-tool-mcp = "echo_tool.mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["echo_tool*"]
