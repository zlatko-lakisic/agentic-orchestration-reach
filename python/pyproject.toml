[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-reach"
version = "0.9.0"
description = "Python AO Reach client for agentic-orchestration session overlays + MCP tunnels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ao_reach*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
